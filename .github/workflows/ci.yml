name: CI
# The console's logic (column guessing, dates, filters, findings) and its SQL, checked against an
# independent pandas calculation on the raw Superstore file.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb pandas pytest
      - name: Core logic
        run: node --test tests/core.test.mjs
      - name: SQL against pandas, on the raw export
        run: python -m pytest tests -q
